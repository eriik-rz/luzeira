# Dependabot (R3-04): una propuesta por semana y ecosistema, todo agrupado en un solo PR.
# «cooldown»: no propone una versión hasta que lleva 7 días publicada (las versiones
# maliciosas se suelen detectar y retirar antes). Las actualizaciones de seguridad no
# esperan. Cada PR pasa por ci, y se revisa antes de aceptarlo (skill «dependencias»).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      editor:
        patterns: ["*"]

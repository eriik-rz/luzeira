# Dependabot (R3-04): una propuesta por semana y ecosistema, todo agrupado en un solo PR.
# «cooldown»: no propone una versión hasta que lleva 7 días publicada (las versiones
# maliciosas se suelen detectar y retirar antes). Las actualizaciones de seguridad no
# esperan. Cada PR pasa por ci, y se revisa antes de aceptarlo (skill «dependencias»).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      editor:
        patterns: ["*"]
    ignore:
      # TypeScript 7 rompe typescript-eslint (ERESOLVE en el PR del 2026-11-25): el salto
      # de versión mayor se hace a mano cuando el linter la admita.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # El módulo de sensores (C#): los paquetes de NuGet (Directory.Packages.props y los
  # packages.lock.json) y el SDK de global.json. Al aceptar uno de NuGet, revisar además
  # RuntimeFrameworkVersion (LuzeiraSensores.csproj) y los propietarios de nuget.config.
  - package-ecosystem: nuget
    directory: /modulo-sensores
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Los System.* van con el runtime (10.x, LTS): el 11 llega con el cambio de .NET.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /modulo-sensores
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dotnet-sdk:
        patterns: ["*"]
    ignore:
      # .NET 10 es LTS (hasta 2028) y el módulo fija su runtime (RuntimeFrameworkVersion):
      # el paso a otra versión mayor se decide a mano, no por un PR semanal.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# Análisis estático de CodeQL (R3-04), configuración avanzada: Python (núcleo), JavaScript
# y TypeScript (editor) y los propios workflows. Sin compilar nada (build-mode: none).
#
# Seguridad (skill seguridad-luzeira):
# - Permisos mínimos: leer el repo y subir los resultados a «Security → Code scanning».
# - Actions fijadas por SHA (github/codeql-action v4.39.3, resuelto el 2026-11-24).
# - ⚠ Con la «configuración por defecto» de CodeQL activada en GitHub, esta no se procesa:
#   tiene que estar desactivada (el 2026-11-24 lo estaba: «not-configured»).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # los lunes

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # subir los resultados
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

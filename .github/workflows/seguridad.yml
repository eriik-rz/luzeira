# Revisión de la cadena de suministro (R3-04): los workflows (zizmor), las dependencias de
# Python (pip-audit) y del editor (npm audit), y que no haya secretos en el historial
# (gitleaks). Cada push a main, cada pull request y una vez por semana (salen
# vulnerabilidades nuevas aunque no cambie nada aquí).
#
# Seguridad (skill seguridad-luzeira):
# - Solo lee el repo; ningún job tiene permisos de escritura ni secretos.
# - Actions fijadas por SHA y herramientas por versión exacta (resueltos con la API de
#   GitHub y PyPI el 2026-11-24). gitleaks se baja de su release y se comprueba su SHA-256.
# - Sin caché: no hay nada que construir.
name: seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # los lunes
  workflow_dispatch:

permissions: {}

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.9"
          enable-cache: false
      - name: zizmor (auditoría de los workflows)
        env:
          GH_TOKEN: ${{ github.token }} # solo lectura: para las comprobaciones en línea
        run: uvx zizmor==1.32.0 .github/workflows

  pip-audit:
    # En Windows: pip-audit solo mira los paquetes que se instalarían en esta plataforma
    # (marcadores sys_platform), y los de la app son de Windows (pywin32, pythonnet…).
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.9"
          enable-cache: false
      - name: pip-audit (las versiones exactas de uv.lock, con sus hashes)
        run: |
          uv export --frozen --format requirements.txt --no-emit-project -o requisitos-auditoria.txt
          uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requisitos-auditoria.txt

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: editor/.nvmrc
      - name: npm audit (lee package-lock.json; no instala nada)
        working-directory: editor
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # todo el historial
      - name: gitleaks 8.30.1 (la misma versión que .pre-commit-config.yaml)
        run: |
          # SHA-256 de gitleaks_8.30.1_checksums.txt de la release v8.30.1 (comprobado
          # bajando el .tar.gz el 2026-11-24).
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$expected  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

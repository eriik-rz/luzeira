# Publica una versión al subir una etiqueta vX.Y.Z (la crea quien mantiene el proyecto: git tag v0.1.0 && git push
# origin v0.1.0). Construye igual que en local (scripts/empaquetar.py), firma la procedencia
# con artifact attestations y publica una release inmutable: primero borrador, luego se
# publica (con releases inmutables, los ficheros ya no cambian una vez publicada).
#
# Seguridad (skill seguridad-luzeira):
# - Permisos mínimos por job; ninguno por defecto.
# - Actions fijadas por SHA (resueltos con la API de GitHub el 2026-11-18).
# - Sin caché en la build de release (una caché envenenada acabaría dentro del instalador).
# - Python embebible e Inno Setup verificados por SHA-256 antes de usarlos.
# - El job que publica espera una aprobación manual (entorno «release» con revisor).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Sigstore, para actions/attest
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: editor/.nvmrc

      - name: La etiqueta coincide con la versión de pyproject.toml
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "La etiqueta $env:GITHUB_REF_NAME no es v$version" }

      - name: Tests
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check

      - name: Python embebible (empaquetar.py comprueba su SHA-256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force descargas | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile descargas/python-embed.zip

      - name: Inno Setup 6.7.4 (instalador verificado; empaquetar.py comprueba además sus binarios)
        shell: pwsh
        run: |
          # SHA-256 publicado por GitHub para el asset de jrsoftware/issrc, release is-6_7_4.
          $expected = "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile descargas/innosetup.exe
          $actual = (Get-FileHash descargas/innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Instalador de Inno Setup con SHA-256 inesperado: $actual" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6"
          $p = Start-Process descargas/innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup no se instaló ($($p.ExitCode))" }

      - name: Instalador, portable y SHA256SUMS
        run: uv run --frozen python scripts/empaquetar.py --python-embebible descargas/python-embed.zip --editor

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release # aprobación manual antes de publicar
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release en borrador, subir y publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "Luzeira ${TAG#v}" -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/*.exe dist/*.zip dist/SHA256SUMS -R "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"

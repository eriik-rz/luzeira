# Prepara una versión al subir una etiqueta vX.Y.Z (la crea quien mantiene el proyecto: git tag v0.1.0 && git push
# origin v0.1.0). Construye igual que en local (scripts/empaquetar.py), firma la procedencia
# con artifact attestations y deja la release EN BORRADOR. Quien mantiene el proyecto la
# firma a mano (scripts/firmar.py: manifest.json + .sig con su clave, que no está en
# GitHub, ADR-006) y la publica. Con releases inmutables, ya no cambia una vez publicada.
# Con --modulo sale también el instalador del módulo de sensores (ADR-007): va en
# SHA256SUMS con lo demás, así que lo cubren la attestation y la firma de SHA256SUMS.
#
# Seguridad (skill seguridad-luzeira):
# - Permisos mínimos por job; ninguno por defecto. Tres jobs: «build» ejecuta el código de
#   las dependencias (npm, uv, pytest) SIN poder firmar nada; «attest» solo baja lo
#   construido y lo atestigua (id-token); «release» crea el borrador (R3-05).
# - npm sin scripts de instalación (npm_config_ignore_scripts): el único paquete que trae
#   uno en Windows es esbuild (fsevents también lo trae, pero es solo de macOS y aquí no se
#   instala), y su postinstall solo comprueba el binario, que llega igual por su
#   dependencia opcional @esbuild/win32-x64.
# - Actions fijadas por SHA (resueltos con la API de GitHub el 2026-11-18).
# - Sin caché en la build de release (una caché envenenada acabaría dentro del instalador).
# - Python embebible e Inno Setup verificados por SHA-256 antes de usarlos.
# - El job que publica espera una aprobación manual (entorno «release» con revisor).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1" # sin telemetría de dotnet en la build
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.9"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: editor/.nvmrc
          package-manager-cache: false # sin caché también aquí (zizmor: cache-poisoning)
      # El SDK de .NET que fija global.json, para el módulo de sensores (ADR-007). Sin
      # caché: setup-dotnet no la activa salvo que se le pida.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: modulo-sensores/global.json

      - name: La etiqueta coincide con la versión de pyproject.toml
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "La etiqueta $env:GITHUB_REF_NAME no es v$version" }

      # Se quedan aquí aunque ci.yml también los pasa: ci corre en los push a main, no en
      # las etiquetas, y nada comprueba que el commit etiquetado pasara ci.
      - name: Tests
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check
          dotnet restore modulo-sensores/LuzeiraSensores.slnx --locked-mode
          dotnet test modulo-sensores/LuzeiraSensores.slnx -c Release --no-restore

      - name: Python embebible (empaquetar.py comprueba su SHA-256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force descargas | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile descargas/python-embed.zip

      - name: Inno Setup 7.1.1 (instalador verificado; empaquetar.py comprueba además sus binarios)
        shell: pwsh
        run: |
          # SHA-256 del .issig publicado por jrsoftware/issrc, release is-7_1_1 (edición x64,
          # la recomendada; comprobado además con gh release verify-asset el 2026-11-23).
          $expected = "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile descargas/innosetup.exe
          $actual = (Get-FileHash descargas/innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Instalador de Inno Setup con SHA-256 inesperado: $actual" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7"
          $p = Start-Process descargas/innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup no se instaló ($($p.ExitCode))" }

      - name: Instalador, portable, instalador del módulo y SHA256SUMS
        env:
          npm_config_ignore_scripts: "true" # el «npm ci» de empaquetar.py, sin postinstall
        run: uv run --frozen python scripts/empaquetar.py --python-embebible descargas/python-embed.zip --editor --modulo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore, para actions/attest
      attestations: write # guardar la attestation en el repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS

  release:
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release # aprobación manual antes de crear el borrador
    permissions:
      contents: write # crear el borrador y subirle los ficheros
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release en borrador (se publica tras firmarla, scripts/firmar.py)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "Luzeira ${TAG#v}" -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/*.exe dist/*.zip dist/SHA256SUMS -R "$GITHUB_REPOSITORY"

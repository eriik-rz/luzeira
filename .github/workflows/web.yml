# Publica la web del proyecto (web/ + el editor en modo simulado) en GitHub Pages.
# Se monta con scripts/web.py, igual que en local.
#
# Seguridad (skill seguridad-luzeira):
# - Permisos mínimos: el job de montar solo lee; el de publicar escribe en Pages.
# - Actions fijadas por SHA (resueltos con la API de GitHub el 2026-11-18).
# - La web no carga nada de fuera (CSP en web/index.html) y no lleva secretos.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "editor/**", "guia/**", "scripts/web.py", "src/luzeira/marca.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025 # el mismo entorno que ci (las dependencias de la app son de Windows)
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: editor/.nvmrc
      - name: Dependencias del editor
        working-directory: editor
        run: npm ci
      - name: Montar la web
        run: uv run --frozen python scripts/web.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

[project]
name = "luzeira"
version = "0.1.7"
description = "App libre para pantallas USB de monitorización del PC, en español y fácil de usar."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Sin email ni datos personales: este fichero va al repo público.
authors = [{ name = "Luzeira contributors" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "nvidia-ml-py>=13.615.71",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pyserial>=3.5",
    "pystray==0.19.5",  # fijada: bandeja.py usa su API privada _message_handlers,
    "pywebview>=6.2.1",
    "winrt-runtime>=4.2.0",
    "winrt-windows-applicationmodel>=4!10.0.28000.2957",
]

[project.scripts]
luzeira = "luzeira.__main__:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607"]  # assert y random con semilla son lo normal en tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "distlib==0.4.4",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

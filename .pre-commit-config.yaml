# Se ejecuta antes de cada commit. Instalación (una vez):
#   uv tool install pre-commit
#   pre-commit install
# Versiones fijadas el 2026-11-17 (última release publicada en GitHub ese día).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # bloquea el commit si detecta una clave o token

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: '(^|/)tsconfig.*\.json$'  # TypeScript admite comentarios (JSONC)
      - id: end-of-file-fixer
      - id: trailing-whitespace

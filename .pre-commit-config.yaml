# Se ejecuta antes de cada commit. Instalación (una vez):
#   uv tool install pre-commit
#   pre-commit install
# Versiones fijadas el 2026-11-17 (última release publicada en GitHub ese día), por el SHA
# del commit de su etiqueta desde el 2026-11-24 (R3-12; lo mismo que «pre-commit autoupdate
# --freeze»): una etiqueta se puede mover a otro código, un SHA no.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks          # bloquea el commit si detecta una clave o token

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: '(^|/)tsconfig.*\.json$'  # TypeScript admite comentarios (JSONC)
      - id: end-of-file-fixer
      - id: trailing-whitespace
